<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dish | Storytime Reader</title>
  <meta name="theme-color" content="#141517">
  <meta name="description" content="Paste any text and hear it read aloud, with word-by-word highlighting.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <!-- Same fonts as the rest of the portfolio -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Proza+Libre:wght@700&display=swap">
  <link rel="stylesheet" href="css/storytime-reader.css">
  <script type="module" src="js/storytime-reader.js"></script>
</head>
<body>
  <!-- Icons. Each <symbol> is drawn once here and reused in the buttons with
       <use href="#icon-...">. They use currentColor, so they match the button's text color. -->
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="icon-previous" viewBox="0 0 24 24"><rect x="5" y="6" width="2.5" height="12" rx="1"/><path d="M18 7v10a1 1 0 0 1-1.55.83l-7.5-5a1 1 0 0 1 0-1.66l7.5-5A1 1 0 0 1 18 7z"/></symbol>
    <symbol id="icon-next" viewBox="0 0 24 24"><rect x="16.5" y="6" width="2.5" height="12" rx="1"/><path d="M6 7v10a1 1 0 0 0 1.55.83l7.5-5a1 1 0 0 0 0-1.66l-7.5-5A1 1 0 0 0 6 7z"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20l1-4.5L15.5 5l3.5 3.5L8.5 19z"/><path d="M16.75 3.75l1.5-1.5a1 1 0 0 1 1.4 0l2.1 2.1a1 1 0 0 1 0 1.4l-1.5 1.5z"/></symbol>
  </svg>

  <main>
    <!-- Same nav as the other portfolio pages. -->
    <nav>
      <h2 id="logo"><a href="index.html">Dish</a></h2>
      <ul class="navigation-items">
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="index.html#skills">Skills</a></li>
        <li><a href="index.html#experience">Experience</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>

    <header>
      <h1>Storytime Reader</h1>
      <p class="tagline">Paste any text, press Play, and follow along as it's read aloud.</p>
    </header>

    <section class="controls" aria-label="Reading controls">
      <div class="settings">
        <fieldset class="engine-toggle">
          <legend>Voice type</legend>
          <label><input type="radio" name="engine" value="browser" checked> Browser</label>
          <label><input type="radio" name="engine" value="ai"> AI</label>
        </fieldset>

        <label class="control">
          Voice
          <select id="voice-select"></select>
        </label>

        <label class="control">
          Speed
          <input id="speed" type="range" min="0.5" max="3" step="0.25" value="1">
          <output id="speed-label" for="speed">1×</output>
        </label>
      </div>

      <div class="transport">
        <button id="prev-btn" class="icon-btn" aria-label="Previous sentence" title="Previous sentence" disabled>
          <svg aria-hidden="true"><use href="#icon-previous"/></svg>
        </button>
        <button id="play-btn" class="icon-btn play" aria-label="Play" title="Play">
          <svg aria-hidden="true"><use id="play-icon" href="#icon-play"/></svg>
        </button>
        <button id="next-btn" class="icon-btn" aria-label="Next sentence" title="Next sentence" disabled>
          <svg aria-hidden="true"><use href="#icon-next"/></svg>
        </button>
        <button id="stop-btn" class="icon-btn" aria-label="Stop" title="Stop" disabled>
          <svg aria-hidden="true"><use href="#icon-stop"/></svg>
        </button>
        <button id="edit-btn" class="edit-btn" hidden>
          <svg aria-hidden="true"><use href="#icon-edit"/></svg>
          Edit text
        </button>
      </div>

      <!-- Shows while the AI voice model downloads (after picking "AI"). -->
      <progress id="load-progress" max="1" value="0" hidden></progress>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="note" class="note" hidden></p>
    </section>

    <!-- The textarea is for typing/pasting. While reading, it's swapped for the
         reading view, where every sentence and word is its own <span>. -->
    <section class="text-box">
      <!-- Shows after pressing Play while the voice gets ready to speak. -->
      <div id="loading-bar" class="loading-bar" aria-hidden="true"><div></div></div>
      <label for="text-input" class="visually-hidden">Text to read</label>
      <textarea id="text-input" placeholder="Paste or type your text here…"></textarea>
      <div id="reading-view" class="reading-view" hidden></div>
    </section>
  </main>
</body>
</html>
